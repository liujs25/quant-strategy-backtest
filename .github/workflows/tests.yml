name: Verify research
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements-publication.txt
      - run: python -m pytest -q
      - run: OMP_NUM_THREADS=1 OPENBLAS_NUM_THREADS=1 python comparison_2026/verify.py
      - run: python scripts/verify_publication.py
